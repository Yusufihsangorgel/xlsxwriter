name: xlsxwriter
description: >-
  Native, fast, low-memory Excel .xlsx writer for Dart. An FFI binding to
  libxlsxwriter with a constant-memory mode for large sheets.
version: 1.2.0
repository: https://github.com/Yusufihsangorgel/xlsxwriter

topics:
  - excel
  - xlsx
  - spreadsheet
  - ffi
  - export

# Descriptions are capped at 160 characters by pub.dev, and the thumbnail on
# the package card is a 190x190 fit rather than a crop, which is why all three
# images are close to square (see tool/benchmark_chart.dart).
screenshots:
  - description: >-
      Every part of the written .xlsx measured at 1,000 and 100,000 rows: eight
      parts are byte-identical, and the worksheet grows 108.7x to 99.93% of the
      bytes.
    path: doc/anatomy.png
  - description: >-
      What the export itself costs, baseline subtracted: constant memory stays
      on zero from 10k to 1M rows, the in-memory default climbs to 1243.6 MiB.
    path: doc/benchmark.png
  - description: >-
      How constant-memory mode works: one row in RAM, the rows behind it
      already XML in a temp file, copied into the .xlsx zip at close.
    path: doc/mechanism.png

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^1.2.1
  ffi: ^2.1.0
  hooks: '>=2.0.2 <3.0.0'
  native_toolchain_c: '>=0.19.2 <0.20.0'

# hook/build.dart only ever branches on OS.windows vs. everything else; it has
# no Android/iOS handling and has never been built or tested on those
# platforms (see README's "Platforms and requirements" section). Declaring
# the supported set here overrides pub.dev's auto-detected tags (pana reads
# this field first, ahead of import-graph analysis), so the site stops
# claiming android/ios support the package doesn't have. This is the
# top-level `platforms:` key (added in Dart 2.16), not the legacy
# `flutter: plugin: platforms:` block — it carries no Flutter SDK constraint,
# so pure-Dart/CLI consumers are unaffected. Add android/ios here once the
# hook is actually verified to build and run on them.
platforms:
  linux:
  macos:
  windows:

dev_dependencies:
  archive: ^4.0.0
  lints: ^6.0.0
  test: ^1.25.0
  xml: ^7.0.0
