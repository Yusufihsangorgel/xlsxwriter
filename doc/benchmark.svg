<svg xmlns="http://www.w3.org/2000/svg" width="960" height="564" viewBox="0 0 960 564">
  <rect width="960.0" height="564.0" fill="#FAF6F0"/>
  <text x="480.0" y="52.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="27.0" font-weight="bold" fill="#1A1A1A" text-anchor="middle">What the export itself costs</text>
  <text x="480.0" y="82.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15.0" font-weight="normal" fill="#6B6B6B" text-anchor="middle">peak RSS minus the same counter sampled before the first write — N rows by 10 columns</text>
  <line x1="118.0" y1="452.0" x2="742.0" y2="452.0" stroke="#B9AE9E" stroke-width="1.4"/>
  <text x="104.0" y="457.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#6B6B6B" text-anchor="end">0</text>
