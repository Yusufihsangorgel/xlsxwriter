  <line x1="118.0" y1="238.7" x2="742.0" y2="238.7" stroke="#E4DCD0" stroke-width="1"/>
  <text x="104.0" y="243.7" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#6B6B6B" text-anchor="end">1200</text>
  <line x1="118.0" y1="185.3" x2="742.0" y2="185.3" stroke="#E4DCD0" stroke-width="1"/>
  <text x="104.0" y="190.3" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#6B6B6B" text-anchor="end">1500</text>
  <line x1="118.0" y1="132.0" x2="742.0" y2="132.0" stroke="#E4DCD0" stroke-width="1"/>
  <text x="104.0" y="137.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#6B6B6B" text-anchor="end">1800</text>
  <text x="30.0" y="292.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#6B6B6B" text-anchor="middle" transform="rotate(-90 30 292.0)">MiB the export added to peak RSS</text>
  <line x1="118.0" y1="452.0" x2="118.0" y2="459.0" stroke="#B9AE9E" stroke-width="1.4"/>
  <text x="118.0" y="482.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16.0" font-weight="normal" fill="#1A1A1A" text-anchor="middle">10k</text>
  <line x1="430.0" y1="452.0" x2="430.0" y2="459.0" stroke="#B9AE9E" stroke-width="1.4"/>
  <text x="430.0" y="482.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16.0" font-weight="normal" fill="#1A1A1A" text-anchor="middle">100k</text>
  <line x1="742.0" y1="452.0" x2="742.0" y2="459.0" stroke="#B9AE9E" stroke-width="1.4"/>
  <text x="742.0" y="482.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16.0" font-weight="normal" fill="#1A1A1A" text-anchor="middle">1M</text>
  <text x="430.0" y="514.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#6B6B6B" text-anchor="middle">rows written (log scale)</text>
  <circle cx="430.0" cy="156.1" r="7" fill="#C62828"/>
  <text x="446.0" y="150.1" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15.0" font-weight="bold" fill="#C62828" text-anchor="start">excel 4.0.6 (pure Dart)</text>
  <text x="446.0" y="170.1" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#C62828" text-anchor="start">1665 MiB at 100k rows</text>
  <polyline points="118.0,449.8 430.0,429.9 742.0,230.9" fill="none" stroke="#E4610F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="118.0,452.0 430.0,452.0 742.0,451.9" fill="none" stroke="#1F77B4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="118.0" cy="449.8" r="6" fill="#E4610F"/>
  <circle cx="118.0" cy="452.0" r="6" fill="#1F77B4"/>
  <circle cx="430.0" cy="429.9" r="6" fill="#E4610F"/>
  <circle cx="430.0" cy="452.0" r="6" fill="#1F77B4"/>
  <circle cx="742.0" cy="230.9" r="6" fill="#E4610F"/>
  <circle cx="742.0" cy="451.9" r="6" fill="#1F77B4"/>
  <text x="756.0" y="226.9" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15.0" font-weight="bold" fill="#E4610F" text-anchor="start">default (in memory)</text>
  <text x="756.0" y="246.9" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#E4610F" text-anchor="start">1244 MiB</text>
  <text x="756.0" y="436.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15.0" font-weight="bold" fill="#1F77B4" text-anchor="start">constant memory</text>
  <text x="756.0" y="456.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#1F77B4" text-anchor="start">0.0–0.4 MiB</text>
  <text x="128.0" y="250.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17.0" font-weight="bold" fill="#1F77B4" text-anchor="start">The blue line is the axis.</text>
  <text x="128.0" y="274.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15.0" font-weight="normal" fill="#1F77B4" text-anchor="start">Streaming never raised the process peak, at any size.</text>
  <text x="480.0" y="530.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="13.0" font-weight="normal" fill="#6B6B6B" text-anchor="middle">Apple Silicon, Dart 3.11. Baseline before the first write: 188 MiB for xlsxwriter, 263 MiB for excel — add it back to get raw peak RSS.</text>
  <text x="480.0" y="550.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="13.0" font-weight="normal" fill="#6B6B6B" text-anchor="middle">Reproduce the two xlsxwriter modes with: dart run bench/bench.dart 1000000 10</text>
</svg>
