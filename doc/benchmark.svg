<svg xmlns="http://www.w3.org/2000/svg" width="700" height="650" viewBox="0 0 700 650">
  <rect width="700.0" height="650.0" fill="#FAF6F0"/>
  <text x="350.0" y="58.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="28.0" font-weight="bold" fill="#1A1A1A" text-anchor="middle">What the export itself costs</text>
  <text x="350.0" y="86.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15.0" font-weight="normal" fill="#6B6B6B" text-anchor="middle">peak RSS minus the same counter sampled before the first write</text>
  <text x="350.0" y="108.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15.0" font-weight="normal" fill="#6B6B6B" text-anchor="middle">N rows by 10 columns, each engine in its own process</text>
  <line x1="108.0" y1="520.0" x2="662.0" y2="520.0" stroke="#B9AE9E" stroke-width="1.4"/>
  <text x="94.0" y="525.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#6B6B6B" text-anchor="end">0</text>
  <line x1="108.0" y1="458.7" x2="662.0" y2="458.7" stroke="#E4DCD0" stroke-width="1"/>
  <text x="94.0" y="463.7" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#6B6B6B" text-anchor="end">300</text>
  <line x1="108.0" y1="397.3" x2="662.0" y2="397.3" stroke="#E4DCD0" stroke-width="1"/>
  <text x="94.0" y="402.3" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#6B6B6B" text-anchor="end">600</text>
  <line x1="108.0" y1="336.0" x2="662.0" y2="336.0" stroke="#E4DCD0" stroke-width="1"/>
  <text x="94.0" y="341.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#6B6B6B" text-anchor="end">900</text>
  <line x1="108.0" y1="274.7" x2="662.0" y2="274.7" stroke="#E4DCD0" stroke-width="1"/>
  <text x="94.0" y="279.7" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#6B6B6B" text-anchor="end">1200</text>
  <line x1="108.0" y1="213.3" x2="662.0" y2="213.3" stroke="#E4DCD0" stroke-width="1"/>
  <text x="94.0" y="218.3" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#6B6B6B" text-anchor="end">1500</text>
  <line x1="108.0" y1="152.0" x2="662.0" y2="152.0" stroke="#E4DCD0" stroke-width="1"/>
  <text x="94.0" y="157.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#6B6B6B" text-anchor="end">1800</text>
  <text x="26.0" y="336.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#6B6B6B" text-anchor="middle" transform="rotate(-90 26 336.0)">MiB the export added to peak RSS</text>
  <line x1="108.0" y1="520.0" x2="108.0" y2="527.0" stroke="#B9AE9E" stroke-width="1.4"/>
  <text x="108.0" y="550.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16.0" font-weight="normal" fill="#1A1A1A" text-anchor="middle">10k</text>
  <line x1="385.0" y1="520.0" x2="385.0" y2="527.0" stroke="#B9AE9E" stroke-width="1.4"/>
  <text x="385.0" y="550.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16.0" font-weight="normal" fill="#1A1A1A" text-anchor="middle">100k</text>
  <line x1="662.0" y1="520.0" x2="662.0" y2="527.0" stroke="#B9AE9E" stroke-width="1.4"/>
  <text x="662.0" y="550.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16.0" font-weight="normal" fill="#1A1A1A" text-anchor="middle">1M</text>
  <text x="385.0" y="578.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#6B6B6B" text-anchor="middle">rows written (log scale)</text>
  <circle cx="385.0" cy="179.7" r="7" fill="#C62828"/>
  <text x="401.0" y="173.7" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15.0" font-weight="bold" fill="#C62828" text-anchor="start">excel 4.0.6 (pure Dart)</text>
  <text x="401.0" y="193.7" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#C62828" text-anchor="start">1664.5 MiB at 100k rows</text>
  <polyline points="108.0,517.4 385.0,494.6 662.0,265.8" fill="none" stroke="#E4610F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="108.0,520.0 385.0,520.0 662.0,519.9" fill="none" stroke="#1F77B4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="108.0" cy="517.4" r="6" fill="#E4610F"/>
  <circle cx="108.0" cy="520.0" r="6" fill="#1F77B4"/>
  <circle cx="385.0" cy="494.6" r="6" fill="#E4610F"/>
  <circle cx="385.0" cy="520.0" r="6" fill="#1F77B4"/>
  <circle cx="662.0" cy="265.8" r="6" fill="#E4610F"/>
  <circle cx="662.0" cy="519.9" r="6" fill="#1F77B4"/>
  <text x="655.0" y="235.8" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15.0" font-weight="bold" fill="#E4610F" text-anchor="end">default (in memory)</text>
  <text x="655.0" y="255.8" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#E4610F" text-anchor="end">1243.6 MiB at 1M rows</text>
  <text x="655.0" y="486.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15.0" font-weight="bold" fill="#1F77B4" text-anchor="end">constant memory</text>
  <text x="655.0" y="506.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14.0" font-weight="normal" fill="#1F77B4" text-anchor="end">0.1 to 0.3 MiB, at every size</text>
  <text x="120.0" y="262.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18.0" font-weight="bold" fill="#1F77B4" text-anchor="start">The blue line is the axis.</text>
  <text x="120.0" y="288.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15.0" font-weight="normal" fill="#1F77B4" text-anchor="start">Streaming never raised the process peak,</text>
  <text x="120.0" y="308.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15.0" font-weight="normal" fill="#1F77B4" text-anchor="start">at any of the three sizes.</text>
  <text x="350.0" y="608.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="13.0" font-weight="normal" fill="#6B6B6B" text-anchor="middle">Apple Silicon, Dart 3.11. Baseline before the first write: 188 MiB for xlsxwriter, 263 MiB for excel;</text>
  <text x="350.0" y="626.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="13.0" font-weight="normal" fill="#6B6B6B" text-anchor="middle">add it back to get raw peak RSS. The excel figure comes from a separate harness; the README says why.</text>
  <text x="350.0" y="644.0" font-family="Georgia, 'Times New Roman', Times, serif" font-size="13.0" font-weight="normal" fill="#6B6B6B" text-anchor="middle">Reproduce the two xlsxwriter modes with: dart run bench/bench.dart 1000000 10</text>
</svg>
